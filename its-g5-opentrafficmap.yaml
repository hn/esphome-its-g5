# Example configuration for the opentrafficmap ITS-G5 receiver hardware.
#
# The its_g5_receiver component is transport agnostic: it captures 802.11p
# frames and fires an on_packet trigger. This example reproduces the reference
# firmware's behaviour by publishing the raw frames to the opentrafficmap MQTT
# server and exposing status/info/stats topics plus a 5-LED status display.

substitutions:
  # Node ID used in all MQTT topics: its/<node_id>/...
  # The reference firmware default is the Ethernet MAC as lowercase hex
  # (e.g. "aabbccddeeff"). If opentrafficmap assigned you a friendly name
  # (e.g. "node789"), use that instead. To find the Ethernet MAC, check the
  # device log on first boot (the "info" topic also publishes it as "emac").
  # node_id: "10bda3ddeeff"
  node_id: "node789"

esphome:
  name: its-g5

esp32:
  board: esp32-c5-devkitc-1
  framework:
    type: esp-idf

logger:

# Home Assistant connection via the native API (independent of MQTT).
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

external_components:
  - source: github://hn/esphome-its-g5
    components: [ its_g5_receiver, ethernet ]

# Uplink. This is the KSZ8851SNL SPI ethernet of the OpenTrafficMap hardware.
# It can be replaced by any other uplink (e.g. an LTE modem) without touching
# the its_g5_receiver component.
ethernet:
  type: KSZ8851SNL
  clk_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO2
  cs_pin: GPIO27
  interrupt_pin: GPIO9
  clock_speed: 16MHz

# MQTT transport to the opentrafficmap C-ITS server. Publishing is anonymous
# (no username/password required). TLS is mandatory (port 8883); the server
# uses a Let's Encrypt certificate, so we verify against the ISRG Root X1 CA
# (isrg-root-x1.pem, not secret). The wildcard certificate
# (*.opentrafficmap.org) covers cits1, so no skip_cert_cn_check is needed.
# Discovery is disabled so we do not publish Home Assistant discovery messages
# to that broker.
mqtt:
  broker: cits1.opentrafficmap.org
  port: 8883
  id: mqtt_client
