  topic_prefix: "its/${node_id}"
  # By default, ESPHome will send a retained MQTT message to <TOPIC_PREFIX>/status
  # with payload 'online', and will tell the broker to send a
  # message <TOPIC_PREFIX>/status with payload 'offline' if the connection drops.
  # Fortunately, these default values exactly match the OpenTrafficMap
  # project, so there is no need to specify them explicitly:
  #
  #birth_message:
  #  topic: "its/${node_id}/status"
  #  payload: "online"
  #  retain: true
  #will_message:
  #  topic: "its/${node_id}/status"
  #  payload: "offline"
  #  retain: true
  on_connect:
    - delay: 3s
    # Publish node info once on connect (its/<node_id>/info).
    - lambda: |-
        uint8_t mac[6];
        ethernet::global_eth_component->get_eth_mac_address_raw(mac);
        char info[160];
        int n = snprintf(info, sizeof(info),
                         "{\"emac\":\"%02x:%02x:%02x:%02x:%02x:%02x\","
                         "\"ver\":\"%s\",\"hwv\":\"esphome\"}",
                         mac[0], mac[1], mac[2], mac[3], mac[4], mac[5],
                         ESPHOME_VERSION);
        id(mqtt_client).publish("its/${node_id}/info", info, n, 0, false);

# On-board LM75 temperature sensor (I2C on GPIO23/GPIO24, address 0x48).
i2c:
  sda: GPIO23
  scl: GPIO24

globals:
  # Heartbeat toggle (LED0).
  - id: hb_on
    type: bool
    restore_value: false
    initial_value: "false"
  # Timestamp (millis) of the last received C-ITS frame (LED4 flash).
  - id: last_packet_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

its_g5_receiver:
  id: g5
  channel: 5900
  broadcast_only: true
  on_packet:
    #   x       -> std::vector<uint8_t>  (raw frame bytes)
    #   rssi    -> float                 (dBm)
    #   channel -> int
    #   rate    -> int
    - lambda: |-
        id(last_packet_ms) = millis();
        id(mqtt_client).publish("its/${node_id}/packet",
                                (const char *) x.data(), x.size(), 0, false);

# 5-LED WS2812 status strip (GPIO27 on the proto-w5500 hardware).
# One addressable effect owns all five LEDs and reads live state each pass:
#   LED0 System  : white heartbeat (1 Hz)
#   LED1 Sniffer : green = running (network up), red = not running
#   LED2 Ethernet: off = no link, blink = link but no IP,
#                  green = 100M + IP, orange = 10M + IP
#   LED3 MQTT    : green = connected, yellow = disconnected
#   LED4 C-ITS   : blue flash for 50 ms on each received frame
light:
  - platform: esp32_rmt_led_strip
    id: status_leds
    name: "Status LEDs"
    pin: GPIO26
    num_leds: 5
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - light.turn_on:
          id: status_leds
          effect: "Status"
    effects:
      - addressable_lambda:
          name: "Status"
          update_interval: 50ms
          lambda: |-
            using namespace esphome;

            // LED0: system heartbeat (white, toggled at 1 Hz by an interval).
            it[0] = id(hb_on) ? Color(255, 255, 255) : Color(0, 0, 0);

            // LED1: sniffer running (approximated by network connectivity).
            bool ip = network::is_connected();
            it[1] = ip ? Color(0, 255, 0) : Color(255, 0, 0);

            // LED2: ethernet link / speed / IP.
            if (!ip) {
              it[2] = (millis() % 500 < 250) ? Color(40, 40, 40) : Color(0, 0, 0);
            } else if (ethernet::global_eth_component->get_link_speed() ==
                       ETH_SPEED_100M) {
              it[2] = Color(0, 255, 0);      // 100M + IP
            } else {
              it[2] = Color(255, 120, 0);    // 10M + IP
            }

            // LED3: MQTT connection state.
            it[3] = id(mqtt_client).is_connected() ? Color(0, 255, 0)
                                                   : Color(255, 255, 0);

            // LED4: C-ITS packet flash (blue for 50 ms after the last frame).
            it[4] = (millis() - id(last_packet_ms) < 50) ? Color(0, 0, 255)
                                                         : Color(0, 0, 0);

interval:
  # Heartbeat toggle for LED0
  - interval: 1000ms
    then:
      - lambda: "id(hb_on) = !id(hb_on);"
  # Periodic stats (its/<node_id>/stats): temperature + uptime seconds
  - interval: 60s
    then:
      - lambda: |-
          char stats[96];
          float temp = id(temp_sensor).state;
          uint64_t rbt = millis_64() / 1000ULL;
          int n;
          if (isnan(temp)) {
            n = snprintf(stats, sizeof(stats), "{\"rbt\":%llu}", rbt);
          } else {
            n = snprintf(stats, sizeof(stats),
                         "{\"temp\":%.1f,\"rbt\":%llu}", temp, rbt);
          }
          id(mqtt_client).publish("its/${node_id}/stats", stats, n, 0, false);

sensor:
  - platform: lm75b
    id: temp_sensor
    name: "Temperature"
    address: 0x48
    update_interval: 10s
  - platform: its_g5_receiver
    its_g5_receiver_id: g5
    packets_received:
      name: "Packets Received"
      icon: mdi:package-variant-closed-check
      filters:
        - throttle: 60s
    packets_dropped:
      name: "Packets Dropped"
      icon: mdi:package-variant-closed-remove
      filters:
        - throttle: 60s
